name: Release Charm Library

on:
  push:
    branches:
      - main
    paths:
      - "lib/charms/glauth_utils/**"

jobs:
  release-lib:
    name: Release any bumped library
    uses: canonical/identity-team/.github/workflows/charm-libs-release.yaml@fc85af7448538c473be450dc2c8ec5d158ea0d15 # v1.17.0
    secrets:
      CHARMCRAFT_CREDENTIALS: ${{ secrets.CHARMCRAFT_CREDENTIALS }}
      PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
