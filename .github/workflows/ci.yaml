name: ci
run-name: CI for ${{ github.sha }} on ${{ github.ref_name }}

on:
   workflow_dispatch:
   workflow_call:
   push:
     branches:
     - "main"
     - "release-**"
     - "track/**"
     paths-ignore:
     - "terraform/**"
   pull_request:
     branches:
     - "*"
     paths-ignore:
     - "terraform/**"

jobs:
  tests:
    name: CI
    uses: canonical/identity-team/.github/workflows/charm-pull-request.yaml@4452d1707af2dff9046222f9e7eaf4ea83758830 # IAM-2282-support-multiple-bases
    with:
      use-charmcraftcache: false
      node-size: xlarge
      tox-unit-test-targets: "build-prerequisites,unit"
      tox-integration-test-targets: "build-prerequisites,integration"
